# Edge Tunnel Panel — Nginx 反代 + HTTPS 示例
# 用法：
#   1. 替换 panel.example.com
#   2. 配置证书（certbot 或自有 PEM）
#   3. ln -s .../nginx-edge-tunnel-panel.conf /etc/nginx/sites-enabled/
#   4. Controller 监听 127.0.0.1:18080，并设置 EDGE_FORCE_HTTPS=1

upstream edge_tunnel_controller {
    server 127.0.0.1:18080;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;

    # certbot 示例路径，按实际修改
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ETP_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 可选：HSTS（确认 HTTPS 稳定后再启用）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://edge_tunnel_controller;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket（/api/v2/stream/machines 等）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# 在 http {} 块中加入（若尚未配置）：
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
