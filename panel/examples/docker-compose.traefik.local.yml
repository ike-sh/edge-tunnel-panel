# 本地 smoke test（HTTP only，无需域名与 Docker Provider）
# 用法（在 panel/examples 目录）：
#   docker compose -f docker-compose.traefik.local.yml up -d
#   curl -sS http://127.0.0.1:18088/api/v1/health
#   浏览器打开 http://127.0.0.1:18088/login

services:
  traefik:
    image: docker.m.daocloud.io/library/traefik:v3.3
    restart: unless-stopped
    ports:
      - "18088:80"
    volumes:
      - ./traefik-dynamic.local.yml:/etc/traefik/dynamic.yml:ro
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80

  controller:
    image: edge-tunnel-panel:v0.3.2
    restart: unless-stopped
    environment:
      EDGE_LISTEN: 0.0.0.0:18080
      EDGE_DATA_DIR: /var/lib/edge-tunnel/controller
      EDGE_WEB_DIR: /opt/edge-tunnel-panel/web
      EDGE_STRICT_AUTH: "false"
      EDGE_FORCE_HTTPS: "0"
    volumes:
      - controller_data:/var/lib/edge-tunnel/controller

volumes:
  controller_data:
