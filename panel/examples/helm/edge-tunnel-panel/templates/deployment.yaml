apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-tunnel-panel.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "edge-tunnel-panel.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "edge-tunnel-panel.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "edge-tunnel-panel.name" . }}
    spec:
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 18080
              name: http
          env:
            - name: EDGE_LISTEN
              value: {{ .Values.env.EDGE_LISTEN | quote }}
            - name: EDGE_DATA_DIR
              value: /var/lib/edge-tunnel/controller
            - name: EDGE_WEB_DIR
              value: /opt/edge-tunnel-panel/web
            - name: EDGE_STRICT_AUTH
              value: {{ .Values.env.EDGE_STRICT_AUTH | quote }}
            - name: EDGE_FORCE_HTTPS
              value: {{ .Values.env.EDGE_FORCE_HTTPS | quote }}
            {{- if .Values.env.EDGE_OPERATOR_TOKEN }}
            - name: EDGE_OPERATOR_TOKEN
              value: {{ .Values.env.EDGE_OPERATOR_TOKEN | quote }}
            {{- end }}
            {{- if .Values.env.EDGE_CONTROLLER_TOKEN }}
            - name: EDGE_CONTROLLER_TOKEN
              value: {{ .Values.env.EDGE_CONTROLLER_TOKEN | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/edge-tunnel/controller
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "edge-tunnel-panel.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
