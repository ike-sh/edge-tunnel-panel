name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel/controller/web/package-lock.json

      - name: Go test
        working-directory: panel/controller
        run: go test ./...

      - name: Web build
        run: |
          npm ci --prefix panel/controller/web
          npm run build --prefix panel/controller/web
